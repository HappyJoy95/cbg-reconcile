# 本机配置：这台电脑负责核对哪家门店
#
# ⚠ **这三行是空的，必须自己填** —— 装好之后到控制台「设置 → 门店」填，
#    改完立刻生效、不用重启。
#
#    以前这个文件是**带着某一家店的真实配置**发出去的，于是别的店装上以后
#    如果忘了改，就会拿别家的账来对 —— **而且看起来一切正常、不报错**。
#    所以现在只发模板、值是空的；配错了程序会直接报出来。
#
#    也正因为如此，这个文件**不进安装包** —— 它是这台电脑自己的东西，
#    手工拷贝/装包时绝不会被覆盖。
store_code: ""               # 华为门店编码。必填 —— 空的话连会话自检都过不了
marker: ""                   # 串号标识里的本店码（比如 Y）。必填
erp_store_name: ""           # 云商里的门店名（卖出店/归属判定用）。必填

timezone: Asia/Shanghai

check:
  # ⚠⚠ 这一段**只给 `python -m src.cli check` 手动跑时用** ——
  #    报量排查已经从日常流程里拿掉了（2026-09-17），
  #    日常那条 `daily` 跑的是「抓四池数据 → POS 合规 → 四池对账」，不吃这里。
  #    控制台的「设置」里**已经不暴露**这几项了，要改只能改这个文件
  #    或者用命令行开关（`check --lookback N --lookahead N`）。
  lookback_days: 0           # 销售窗口往前多看几天。默认 0：只查目标日当天的销售。
                             # 想追历史漏报（比如补查上周）再调大。
  report_lookahead_days: 0   # 华为窗口往后多看几天。默认 0：只看目标日当天。
                             # 调成 1 能容忍"23:50 卖的货次日 00:10 才报量"，
                             # 代价是目标日之后补报的也算进来 —— 按需选。
                             # 门店营业时间 09:30-21:30，跨零点的情况本来就少。
  # ⚠ 原来的 page_size / pay_status / return_status 2026-09-17 删了 ——
  #   它们**从来没生效过**：`dump.py` 用自己的 `--page-size`（默认 200），
  #   而且明确不许传 payStatus/returnStatus（传了会把已退原单整张滤掉）。
  #   老门店的 yaml 里可能还留着这三行 —— **留着无害，程序看都不看**。

session:
  # ⚠ 这里**故意不写 file** —— 会话文件名由 store_code 自动推出来
  #   （`.secrets/cbg-<门店码>.json`）。写死的话，改了门店编码文件名还是旧的，
  #   看起来像"会话没换"，很容易对错店。
  #
  # 门店日常入口。未登录时它会自己跳到华为 SSO 登录页 ——
  # 不去硬编码登录地址，换域名/换 SSO 版本时不用改代码。
  login_url: "https://cbg.huawei.com/#/group/smart-store/homepage"
  # 华为账号密码（配了就能自动登录，不用手点）。存 .secrets/huawei.env，界面上填。
  login_env_file: .secrets/huawei.env
  # 浏览器 profile —— 存 SSO 登录态的地方。
  # 首次跑 `python -m src.cli auth --auto` 打开浏览器登录一次；
  # 之后会话失效会自动用**无头模式**从这里静默续期，不用再手抄 curl。
  browser_profile: .secrets/browser-profile
  auto_refresh: true          # check 时若会话失效，自动静默续期一次

browser:
  # 自动抓会话用哪个浏览器 —— **不配也行，默认 Chrome 优先**：
  #   装了 Chrome 就用 Chrome，没装才用 Edge。
  # ⚠ **Edge 不是所有 Windows 都自带** —— Win10 自带，**Win7 上不一定有**
  #   （出厂只有 IE11，而 IE11 干不了这事）。用 Edge 的话建议显式写：
  #     prefer: [edge, chrome]
  # 为什么默认 Chrome 优先：Edge 从**管理员**进程启动时自我降权重启更凶，
  # 抓会话容易被中途掐断。
  #
  # 想换顺序就写一行（名字认：chrome / edge / brave / chromium）：
  #   prefer: [edge, chrome]
  # 认不出的名字会被忽略 —— 写错不会让"自动抓会话"整个用不了。

erp:
  # 凭据按此顺序找：环境变量 > 本文件 > ~/.dsh/secrets/erp.env
  env_file: .secrets/erp.env

mail:
  # 每次跑完把差异清单（xlsx 附件 + 正文摘要）发到指定邮箱。
  # 密码在 .secrets/mail.env（界面上填，不回显）。
  enabled: false
  host: ""          # QQ邮箱 smtp.qq.com｜腾讯企业邮 smtp.exmail.qq.com｜163 smtp.163.com
  port: 465
  security: ssl              # ssl | starttls | none
  sender: ""                 # 发件人；留空则用账号
  recipients: ""             # 收件人，逗号分隔，可以填多个
  subject_prefix: "[报量对账]"
  when: always               # always=每次都发｜only_diff=只有差异才发
  env_file: .secrets/mail.env

wecom:
  # 企业微信群机器人推送。webhook 地址在 .secrets/wecom.env（界面上填）。
  # ⚠ 企微限流每分钟 20 条，正常情况下一次只发 1~3 条。
  enabled: false
  when: only_diff               # always=每次都推｜only_diff=只有差异才推
  mention_all: false          # 有差异时 @所有人（企微 markdown 不能 @，会单独发一条 text）
  send_file: true            # 同时把差异清单 xlsx 传到群里
  env_file: .secrets/wecom.env
