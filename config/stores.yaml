# 门店名单 —— **云商门店名 ↔ 华为门店编码 ↔ 串号标识**（唯一真源）
#
# 来源：用户 2026-09-18 给的全量名单（29 家），逐行核对过。
# 字段：
#   marker       串号标识（本店码）。**空的表示还没拿到** —— 不影响运行。
#   erp_name     云商里的门店名 —— **匹配的主键**（`sales_rows` 里的「门店」就是它）。
#   huawei_code  华为门店编码（SCN… / CNSCN… / RA…）。空的表示未知：
#                不传 storeCode 时，华为接口默认按会话自身所属门店查询。
#   huawei_name  华为侧完整名字（授权体验店的工商全称）。
#   kind         店型：`体验店` / `合作店`。**从 huawei_name 里认出来的**
#                （含「授权体验店」的是体验店，含「合作店」的是合作店）。
#
# ⚠ `kind` 不是装饰：
#   * **调拨规则只认体验店** —— `cli.load_config` 的 `_experience` 只收 `kind == 体验店`，
#     因为「其他体验店卖出(调拨处理)」那条跳过说的是"体验店之间走调拨"。
#     把合作店也算进去，它们的销售会被当成调拨跳过（那是改行为，不是加数据）。
#   * 目前那条规则只在**老 `check` 子命令**里跑得到（报量排查 2026-09-17 整步拿掉了），
#     每天那条 `daily` 走的是 `pools.py`，**不读这份名单**。
#
# ⚠ 串号标识的来历（2026-09-15 交叉验证）：用「库存串号」视角拉全库在库/在途
#   26,015 行，按 `串号标识` 分组看 `分仓` 落在哪，14 个码各自都指向唯一一个仓、
#   与门店名精确对应。见设计文档 §三。
stores:
  # ⚠ **虚拟门店**：云商**平台岗账号**登录时写的就是它。
  #   用户 2026-09-19：「平台岗就做个虚拟的平台岗门店就是了」。
  #
  #   它不绑任何一家店（`huawei_code` 留空），但**身份照样写进配置** ——
  #   于是"平台岗"和"某家店"走**同一套机制**。
  #   ⚠ 原来是靠配置里一个独立的 `platform: true` 标志：登录平台岗时只写那个标志、
  #     **不清原来那家店的字段** ⇒ 配置里同时留着"麦凯乐店"+"平台岗"，
  #     而画像是 platform 优先短路 ⇒ 那家店成了**死数据**，哪天标志一关它就"活过来"。
  #   ⚠ `kind` 就是判据（`config_io.PLATFORM_KIND`），别改成别的写法。
  - marker: ""
    erp_name: "平台岗"
    huawei_code: ""
    huawei_name: "盛联平台岗（不绑门店）"
    kind: 平台岗
