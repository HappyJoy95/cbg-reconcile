# 体验店名单 + 串号标识映射（唯一真源）
#
# 验证方式：2026-09-15 用「库存串号」视角交叉验证 ——
#   拉全库在库/在途合计 26,015 行，按 `串号标识` 分组看 `分仓` 落在哪，
#   14 个码各自都指向唯一一个仓，与门店名精确对应。见设计文档 §三。
#
# huawei_code 是华为门店编码（SCN…）。空的表示未知 —— 不影响运行：
#   不传 storeCode 时，华为接口默认按会话自身所属门店查询。
