# ⚠ 以下标识**不是门店码**，是机况/来源标记，不得当作门店处理
# （2026-09-15 实测在库台数）：
#   J 4,727 台 · A 126 台（落海信广场）· jc 90 台 ·
#   销售助手 23 · 售后换回 12 · 外地 3 · 自用 2 · 旧 1
non_store_markers:
  - J
  - A
  - jc
  - 销售助手
  - 售后换回
  - 外地
  - 自用
  - 旧

# 云商单据类型（实测分布，2026-09-14 全天 446 行）
doc_types:
  # include 是白名单：名单外的类型**不静默丢弃**，会进「过滤统计」并计入
  # 「未识别单据类型:xxx」，让人看得见（实测出现过 客情单 / 空值）
  include: [零售, 分销, 客情单]
  exclude: [零售退, 分销退, 核销]   # 退货不是"卖货"；核销单金额为 0
